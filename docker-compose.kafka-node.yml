# ============================================================
#  Un nodo de Kafka para una EC2 aparte de la aplicación.
#
#  Son tres máquinas. En cada una corre un Zookeeper y un broker.
#  No van en la EC2 de la app: esa t3.medium ya usa la RAM con
#  RabbitMQ y los servicios Java. Además, si los tres brokers
#  estuvieran en la misma máquina, al apagarse esa máquina se
#  caería el clúster entero.
#
#  En el .env de ESTA máquina, las tres IP privadas (las mismas
#  en las tres EC2) y el número de este nodo:
#    KAFKA_NODE_IP_1=10.0.1.11
#    KAFKA_NODE_IP_2=10.0.1.12
#    KAFKA_NODE_IP_3=10.0.1.13
#    KAFKA_NODE_ID=1
#    KAFKA_ADVERTISED_HOST=10.0.1.11
#  KAFKA_ADVERTISED_HOST es la IP privada de esta máquina, la misma
#  que ocupa su lugar en la lista. El código Java no se toca.
#
#  Security group, solo entre estas tres EC2 y la de la app:
#    9092 (broker), 2181 (clientes de Zookeeper), 2888 y 3888 (el voto).
#  No abrir 9092 a internet.
#
#  Levantar, en cada máquina, después de instalar Docker:
#    docker compose -f docker-compose.kafka-node.yml up -d
# ============================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    network_mode: host
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: ${KAFKA_NODE_ID:?falta KAFKA_NODE_ID (1, 2 o 3)}
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: ${KAFKA_NODE_IP_1:?falta KAFKA_NODE_IP_1}:2888:3888;${KAFKA_NODE_IP_2:?falta KAFKA_NODE_IP_2}:2888:3888;${KAFKA_NODE_IP_3:?falta KAFKA_NODE_IP_3}:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    network_mode: host
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: ${KAFKA_NODE_ID:?falta KAFKA_NODE_ID (1, 2 o 3)}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_NODE_IP_1:?falta KAFKA_NODE_IP_1}:2181,${KAFKA_NODE_IP_2:?falta KAFKA_NODE_IP_2}:2181,${KAFKA_NODE_IP_3:?falta KAFKA_NODE_IP_3}:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:?falta KAFKA_ADVERTISED_HOST}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 10"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  zk_data:
  zk_log:
  kafka_data:
