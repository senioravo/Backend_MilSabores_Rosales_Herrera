# Balanceador delante de las dos réplicas de ventas-service.
# Si una réplica falla dos veces seguidas, nginx la saca de la rotación
# por 10 segundos y todo el tráfico sigue por la otra réplica.
upstream ventas_backend {
    server ventas-service-1:8084 max_fails=2 fail_timeout=10s;
    server ventas-service-2:8084 max_fails=2 fail_timeout=10s;
}

server {
    listen 8084;

    location / {
        proxy_pass http://ventas_backend;

        # Si la réplica elegida no contesta, reintenta en la otra antes
        # de devolver error al bff.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
