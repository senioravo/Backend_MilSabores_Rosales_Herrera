spring.application.name=ventas-service
server.port=8084
server.address=0.0.0.0

# Database Configuration - Neon PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/milsabores}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI/Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# Transbank Webpay Plus - INTEGRATION Environment
transbank.api.url=https://webpay3gint.transbank.cl
transbank.api.key-id=597055555532
transbank.api.key-secret=579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C
transbank.return.url=https://dsy-1104-rosales-herrera.vercel.app/api/ventas/transbank/return

# RabbitMQ. Dentro de Docker, rabbit1 y rabbit2 son los nodos del clúster.
# Si el JAR corre en el PC: RABBITMQ_ADDRESSES=localhost:5672,localhost:5673
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:rabbit1:5672,rabbit2:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

# Kafka. Dentro de Docker, los tres brokers del clúster.
# Si el JAR corre en el PC:
# KAFKA_BOOTSTRAP_SERVERS=localhost:19092,localhost:19093,localhost:19094
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka1:9092,kafka2:9092,kafka3:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.milsabores.kafka
spring.kafka.consumer.auto-offset-reset=earliest
# Ventas lee con el grupo auditoria. La notificación la hace productos.
spring.kafka.consumer.group-id=auditoria
milsabores.kafka.group.notificacion=notificacion
milsabores.kafka.group.auditoria=auditoria

# Actuator - health checks para Docker, Kubernetes (liveness/readiness) y Render
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
