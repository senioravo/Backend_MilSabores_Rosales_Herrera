# ============================================================
#  Mil Sabores - entorno local con Docker Compose
#
#  Requisitos: archivo .env en esta carpeta (copiar .env.example)
#  con DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD y JWT_SECRET.
#
#  Levantar:  docker compose up --build -d
#  Logs:      docker compose logs -f api-gateway
#  Bajar:     docker compose down
#
#  Punto de entrada: http://localhost:8080 (api-gateway)
#
#  RabbitMQ local (EP2), dos nodos del mismo clúster:
#    rabbit1  AMQP 5672   web http://localhost:15672
#    rabbit2  AMQP 5673   web http://localhost:15673
# ============================================================

x-spring-service: &spring-service
  restart: unless-stopped
  env_file: .env
  networks: [milsabores]

services:
  usuario-service:
    <<: *spring-service
    build: ./usuario-service
    image: milsabores/usuario-service:latest
    ports: ["8081:8081"]

  producto-service:
    <<: *spring-service
    build:
      context: ./producto-service
      additional_contexts:
        rabbit-topology: ./rabbit-topology
    image: milsabores/producto-service:latest
    ports: ["8082:8082"]
    depends_on:
      rabbit-topology: { condition: service_completed_successfully }

  carrito-service:
    <<: *spring-service
    build: ./carrito-service
    image: milsabores/carrito-service:latest
    ports: ["8083:8083"]

  ventas-service:
    <<: *spring-service
    build:
      context: ./ventas-service
      additional_contexts:
        rabbit-topology: ./rabbit-topology
    image: milsabores/ventas-service:latest
    ports: ["8084:8084"]
    depends_on:
      rabbit-topology: { condition: service_completed_successfully }

  bff:
    <<: *spring-service
    build: ./bff
    image: milsabores/bff:latest
    ports: ["8085:8085"]
    environment:
      USUARIO_SERVICE_URL: http://usuario-service:8081
      PRODUCTO_SERVICE_URL: http://producto-service:8082
      CARRITO_SERVICE_URL: http://carrito-service:8083
      VENTAS_SERVICE_URL: http://ventas-service:8084
      RABBIT_ADMIN_SERVICE_URL: http://rabbit-admin:8086
    depends_on:
      usuario-service: { condition: service_healthy }
      producto-service: { condition: service_healthy }
      carrito-service: { condition: service_healthy }
      ventas-service: { condition: service_healthy }
      rabbit-admin: { condition: service_healthy }

  api-gateway:
    <<: *spring-service
    build: ./api-gateway
    image: milsabores/api-gateway:latest
    ports: ["8080:8080"]
    environment:
      USUARIO_SERVICE_URL: http://usuario-service:8081
      PRODUCTO_SERVICE_URL: http://producto-service:8082
      CARRITO_SERVICE_URL: http://carrito-service:8083
      VENTAS_SERVICE_URL: http://ventas-service:8084
      BFF_SERVICE_URL: http://bff:8085
    depends_on:
      bff: { condition: service_healthy }

  rabbit-admin:
    <<: *spring-service
    build: ./rabbit-admin
    image: milsabores/rabbit-admin:latest
    ports: ["8086:8086"]
    depends_on:
      rabbit2: { condition: service_healthy }

  # Declara exchanges, colas y DLQ, y termina. Con un volumen nuevo
  # el clúster parte sin colas y los listeners de producto no arrancan.
  rabbit-topology:
    build: ./rabbit-topology
    image: milsabores/rabbit-topology:latest
    restart: "no"
    env_file: .env
    environment:
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
    networks: [milsabores]
    depends_on:
      rabbit2: { condition: service_healthy }

  # Nodo 1 del clúster.
  rabbit1:
    image: rabbitmq:4.2-management
    hostname: rabbit1
    container_name: rabbit1
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-milsabores-erlang-cookie}
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [milsabores]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  # Nodo 2. Mismos secreto y configuración. Puertos distintos en Windows
  # porque 5672 y 15672 ya los usa rabbit1.
  rabbit2:
    image: rabbitmq:4.2-management
    hostname: rabbit2
    container_name: rabbit2
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-milsabores-erlang-cookie}
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [milsabores]
    depends_on:
      rabbit1: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  milsabores:
    driver: bridge

volumes:
  rabbit1_data:
  rabbit2_data:
