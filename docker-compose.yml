# ============================================================
#  Mil Sabores - entorno local con Docker Compose
#
#  Requisitos: archivo .env en esta carpeta (copiar .env.example)
#  con DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD y JWT_SECRET.
#
#  Levantar:  docker compose up --build -d
#  Logs:      docker compose logs -f api-gateway
#  Bajar:     docker compose down
#
#  Punto de entrada: http://localhost:8080 (api-gateway)
#
#  RabbitMQ local (EP2), dos nodos del mismo clúster:
#    rabbit1  AMQP 5672   web http://localhost:15672
#    rabbit2  AMQP 5673   web http://localhost:15673
#
#  Kafka local (EP3). Tres Zookeeper y tres brokers, un proceso por
#  contenedor. kafka-topology crea los dos topics y se apaga.
#  Desde Windows el broker se ve en:
#    kafka1  localhost:19092
#    kafka2  localhost:19093
#    kafka3  localhost:19094
#  Entre contenedores se hablan por kafka1:9092, kafka2:9092 y kafka3:9092.
#  La pantalla para ver el clúster: http://localhost:8090
#  kafka-admin crea, cambia y borra topics. Puerto 8087.
#  Desde afuera entra por el gateway, en /api/kafka-admin, con rol ADMIN.
# ============================================================

x-spring-service: &spring-service
  restart: unless-stopped
  env_file: .env
  networks: [milsabores]

services:
  usuario-service:
    <<: *spring-service
    build: ./usuario-service
    image: milsabores/usuario-service:latest
    ports: ["8081:8081"]

  producto-service:
    <<: *spring-service
    build:
      context: ./producto-service
      additional_contexts:
        rabbit-topology: ./rabbit-topology
        kafka-topology: ./kafka-topology
    image: milsabores/producto-service:latest
    ports: ["8082:8082"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      rabbit-topology: { condition: service_completed_successfully }
      kafka-topology: { condition: service_completed_successfully }

  carrito-service:
    <<: *spring-service
    build: ./carrito-service
    image: milsabores/carrito-service:latest
    ports: ["8083:8083"]

  # Dos réplicas del mismo microservicio. Si una JVM se cae o deja de
  # responder, ventas-lb.conf (nginx, más abajo) deja de enviarle tráfico
  # y la otra sigue vendiendo. Ninguna publica puerto propio: solo se
  # llega por el nombre "ventas-service", que ahora es el balanceador.
  ventas-service-1: &ventas-app
    <<: *spring-service
    build:
      context: ./ventas-service
      additional_contexts:
        rabbit-topology: ./rabbit-topology
        kafka-topology: ./kafka-topology
    image: milsabores/ventas-service:latest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      rabbit-topology: { condition: service_completed_successfully }
      kafka-topology: { condition: service_completed_successfully }

  ventas-service-2:
    <<: *ventas-app

  # Balanceador delante de las dos réplicas. Mantiene el nombre
  # "ventas-service" para que bff y api-gateway no cambien de URL.
  ventas-service:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [milsabores]
    ports: ["8084:8084"]
    volumes:
      - ./infra/nginx/ventas-lb.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx resuelve ventas-service-1/2 una sola vez al arrancar. Si se
    # redespliegan (nuevo build, nuevo contenedor, IP nueva), un "reload"
    # las vuelve a resolver sin cortar ninguna conexión en curso. Este loop
    # recarga cada 15s, así nunca queda apuntando a un contenedor que ya no existe.
    command: ["sh", "-c", "while :; do sleep 15; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      ventas-service-1: { condition: service_healthy }
      ventas-service-2: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1, no localhost: adentro del contenedor "localhost" resuelve
      # primero a ::1 y nginx solo escucha en IPv4 (el montaje de solo
      # lectura le impide agregar el listener IPv6 por sí mismo).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bff:
    <<: *spring-service
    build: ./bff
    image: milsabores/bff:latest
    ports: ["8085:8085"]
    environment:
      # Azure Entra: al arrancar, bff resuelve login.microsoftonline.com para
      # el discovery OIDC. Si Docker Desktop no tiene salida IPv6 pero el DNS
      # devuelve registros IPv6 primero, la conexión falla con "Network
      # unreachable" y bff no levanta. Forzar IPv4 evita ese intento.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      USUARIO_SERVICE_URL: http://usuario-service:8081
      PRODUCTO_SERVICE_URL: http://producto-service:8082
      CARRITO_SERVICE_URL: http://carrito-service:8083
      VENTAS_SERVICE_URL: http://ventas-service:8084
      RABBIT_ADMIN_SERVICE_URL: http://rabbit-admin:8086
      KAFKA_ADMIN_SERVICE_URL: http://kafka-admin:8087
    depends_on:
      usuario-service: { condition: service_healthy }
      producto-service: { condition: service_healthy }
      carrito-service: { condition: service_healthy }
      ventas-service: { condition: service_healthy }
      rabbit-admin: { condition: service_healthy }
      kafka-admin: { condition: service_healthy }

  api-gateway:
    <<: *spring-service
    build: ./api-gateway
    image: milsabores/api-gateway:latest
    ports: ["8080:8080"]
    environment:
      USUARIO_SERVICE_URL: http://usuario-service:8081
      PRODUCTO_SERVICE_URL: http://producto-service:8082
      CARRITO_SERVICE_URL: http://carrito-service:8083
      VENTAS_SERVICE_URL: http://ventas-service:8084
      BFF_SERVICE_URL: http://bff:8085
    depends_on:
      bff: { condition: service_healthy }

  rabbit-admin:
    <<: *spring-service
    build: ./rabbit-admin
    image: milsabores/rabbit-admin:latest
    ports: ["8086:8086"]
    depends_on:
      rabbit2: { condition: service_healthy }

  kafka-admin:
    <<: *spring-service
    build: ./kafka-admin
    image: milsabores/kafka-admin:latest
    ports: ["8087:8087"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }

  # Declara exchanges, colas y DLQ, y termina. Con un volumen nuevo
  # el clúster parte sin colas y los listeners de producto no arrancan.
  rabbit-topology:
    build: ./rabbit-topology
    image: milsabores/rabbit-topology:latest
    restart: "no"
    env_file: .env
    environment:
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
    networks: [milsabores]
    depends_on:
      rabbit2: { condition: service_healthy }

  # Nodo 1 del clúster.
  rabbit1:
    image: rabbitmq:4.2-management
    hostname: rabbit1
    container_name: rabbit1
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-milsabores-erlang-cookie}
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [milsabores]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  # Nodo 2. Mismos secreto y configuración. Puertos distintos en Windows
  # porque 5672 y 15672 ya los usa rabbit1.
  rabbit2:
    image: rabbitmq:4.2-management
    hostname: rabbit2
    container_name: rabbit2
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-milsabores-erlang-cookie}
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [milsabores]
    depends_on:
      rabbit1: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  # EP3. Zookeeper guarda la lista de brokers y elige un líder nuevo
  # si uno se cae. Son tres para que el voto siga aunque caiga uno.
  zookeeper1: &zookeeper
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper1
    container_name: zookeeper1
    restart: unless-stopped
    ports: ["2181:2181"]
    environment: &zk-env
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - zookeeper1_data:/var/lib/zookeeper/data
      - zookeeper1_log:/var/lib/zookeeper/log
    networks: [milsabores]
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  zookeeper2:
    <<: *zookeeper
    hostname: zookeeper2
    container_name: zookeeper2
    ports: ["2182:2181"]
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2_data:/var/lib/zookeeper/data
      - zookeeper2_log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper
    hostname: zookeeper3
    container_name: zookeeper3
    ports: ["2183:2181"]
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3_data:/var/lib/zookeeper/data
      - zookeeper3_log:/var/lib/zookeeper/log

  # Tres brokers. Cada uno es un nodo de Kafka. El factor 3 obliga a
  # que los topics internos también tengan una copia en cada broker.
  kafka1: &kafka
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka1
    container_name: kafka1
    restart: unless-stopped
    ports: ["19092:9094"]
    environment: &kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks: [milsabores]
    depends_on:
      zookeeper1: { condition: service_healthy }
      zookeeper2: { condition: service_healthy }
      zookeeper3: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 10"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka2:
    <<: *kafka
    hostname: kafka2
    container_name: kafka2
    ports: ["19093:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:19093
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    hostname: kafka3
    container_name: kafka3
    ports: ["19094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:19094
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # Pantalla de solo lectura. No publica ni crea topics: muestra brokers,
  # particiones, réplicas y mensajes. El puerto 8080 de adentro se publica
  # en 8090 porque 8080 ya lo usa el api-gateway.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: milsabores
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181
      DYNAMIC_CONFIG_ENABLED: "false"
    networks: [milsabores]
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }

  # Crea milsabores.stock y milsabores.ventas, y termina.
  # No se queda corriendo. Si el volumen de Kafka ya tiene los topics,
  # los vuelve a dejar con la misma retención.
  kafka-topology:
    build: ./kafka-topology
    image: milsabores/kafka-topology:latest
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+ExitOnOutOfMemoryError"
    networks: [milsabores]
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }

networks:
  milsabores:
    driver: bridge

volumes:
  rabbit1_data:
  rabbit2_data:
  zookeeper1_data:
  zookeeper1_log:
  zookeeper2_data:
  zookeeper2_log:
  zookeeper3_data:
  zookeeper3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
