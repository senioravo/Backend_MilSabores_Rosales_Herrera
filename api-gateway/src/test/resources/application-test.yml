spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
            allowCredentials: true
      routes:
        - id: test-downstream
          uri: https://example.org
          predicates:
            - Path=/api/**,/bff/**

azure:
  entra:
    enabled: false

jwt:
  secret: test-jwt-secret-milsabores-gateway-validation-min-32-chars
