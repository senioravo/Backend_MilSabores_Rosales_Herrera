spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: usuario-service
          uri: ${USUARIO_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/usuarios/**
        - id: producto-service
          uri: ${PRODUCTO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/productos/**
        - id: categoria-service
          uri: ${PRODUCTO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/categorias/**
        - id: carrito-service
          uri: ${CARRITO_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/carritos/**
        - id: ventas-service
          uri: ${VENTAS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/ventas/**
        - id: bff
          uri: ${BFF_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/bff/**
      # El CORS se resuelve solo aquí. Sin quitar Origin, los servicios aplican
      # su propio CorsConfig (solo localhost): rechazan con 403 los orígenes de
      # producción y duplican Access-Control-Allow-Origin en los de localhost.
      default-filters:
        - RemoveRequestHeader=Origin
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              # Frontend desplegado en Vercel (sobrescribible con FRONTEND_URL)
              - "${FRONTEND_URL:https://dsy-1104-rosales-herrera.vercel.app}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

server:
  port: 8080

# Mismo secreto que usuario-service usa para firmar los tokens: el gateway
# valida la firma, no la genera.
jwt:
  secret: ${JWT_SECRET:milsabores-secret-key-2024-super-segura-para-produccion-cambiar}

# Rate limiting en memoria (ver RateLimitingFilter) - una unica instancia de
# gateway, sin Redis.
rate-limit:
  requests-per-window: ${RATE_LIMIT_REQUESTS:60}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
