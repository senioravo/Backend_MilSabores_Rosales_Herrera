spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # EP1: el gateway solo enruta al BFF; el BFF orquesta hacia los microservicios.
        - id: bff-orchestrator
          uri: ${BFF_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/**,/bff/**
      # El CORS se resuelve solo aquí. Sin quitar Origin, los servicios aplican
      # su propio CorsConfig (solo localhost): rechazan con 403 los orígenes de
      # producción y duplican Access-Control-Allow-Origin en los de localhost.
      default-filters:
        - RemoveRequestHeader=Origin
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        # OPTIONS preflight debe responder CORS aunque aún no enrute (guía frontend)
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "${FRONTEND_URL:https://dsy-1104-rosales-herrera.vercel.app}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
            allowCredentials: true
            maxAge: 3600

server:
  port: 8080

# Mismo secreto que usuario-service usa para firmar los tokens: el gateway
# valida la firma, no la genera.
jwt:
  secret: ${JWT_SECRET:milsabores-secret-key-2024-super-segura-para-produccion-cambiar}

# Microsoft Entra ID — mismo tenant/audience que VITE_AZURE_* en el frontend
azure:
  entra:
    enabled: ${AZURE_ENTRA_ENABLED:false}
    tenant-id: ${AZURE_TENANT_ID:}
    client-id: ${AZURE_CLIENT_ID:}
    audience: ${AZURE_API_AUDIENCE:}

# Rate limiting en memoria (ver RateLimitingFilter) - una unica instancia de
# gateway, sin Redis.
rate-limit:
  requests-per-window: ${RATE_LIMIT_REQUESTS:60}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
