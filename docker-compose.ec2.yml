# ============================================================
#  Mil Sabores - despliegue en una EC2 t3.medium (AWS Academy)
#
#  t3.medium = 4 GB de RAM y 2 vCPU con créditos, así que:
#  - 7 JVMs: 4 servicios de datos + rabbit-admin + bff + gateway
#    (EP1: el gateway solo enruta al bff).
#  - Cada JVM tiene heap y metaspace acotados (JAVA_OPTS): ~450 MB
#    por servicio, ~3,1 GB en total.
#  - usuario y carrito arrancan ya. producto y ventas esperan a que
#    rabbit-topology declare las colas. El bff espera a los cuatro
#    y a rabbit-admin.
#  - Solo el gateway publica su puerto; el resto de Java queda en la red interna.
#  - RabbitMQ (EP2, P3): rabbit1 y rabbit2, el mismo clúster que en local.
#    La web se publica en 15672 y 15673. El AMQP no sale de la red Docker.
#  - rabbit-topology declara las seis colas y se apaga. No se queda corriendo.
#  - La instancia lleva swap (ec2-setup.sh) como margen de memoria.
#
#  En una t3.small (2 GB), definir en .env:
#    EC2_JAVA_OPTS=-Xms64m -Xmx160m -XX:MaxMetaspaceSize=140m -XX:ReservedCodeCacheSize=40m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
#
#  Las imágenes se construyen en el PC y se copian a la EC2:
#    .\scripts\ec2\deploy-ec2.ps1 -Ip <IP-elástica> -Key labsuser.pem -Up
#  Paso a paso: docs/DEPLOY.md, sección 4.
# ============================================================

x-spring-service: &spring-service
  restart: unless-stopped
  env_file: .env
  networks: [milsabores]
  environment: &jvm
    JAVA_OPTS: "${EC2_JAVA_OPTS:--Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError}"
  # Con 4 JVMs arrancando a la vez en 2 vCPU, el arranque supera el
  # start-period de 90 s del Dockerfile
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/actuator/health > /dev/null || exit 1"]
    interval: 20s
    timeout: 5s
    start_period: 240s
    retries: 5

services:
  usuario-service:
    <<: *spring-service
    build: ./usuario-service
    image: milsabores/usuario-service:latest

  producto-service:
    <<: *spring-service
    build:
      context: ./producto-service
      additional_contexts:
        rabbit-topology: ./rabbit-topology
    image: milsabores/producto-service:latest
    environment:
      <<: *jvm
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
    depends_on:
      rabbit-topology: { condition: service_completed_successfully }

  carrito-service:
    <<: *spring-service
    build: ./carrito-service
    image: milsabores/carrito-service:latest

  ventas-service:
    <<: *spring-service
    build:
      context: ./ventas-service
      additional_contexts:
        rabbit-topology: ./rabbit-topology
    image: milsabores/ventas-service:latest
    environment:
      <<: *jvm
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
    depends_on:
      rabbit-topology: { condition: service_completed_successfully }

  # EP1: el gateway enruta /api/** y /bff/** al bff, que orquesta los servicios
  bff:
    <<: *spring-service
    build: ./bff
    image: milsabores/bff:latest
    environment:
      <<: *jvm
      USUARIO_SERVICE_URL: http://usuario-service:8081
      PRODUCTO_SERVICE_URL: http://producto-service:8082
      CARRITO_SERVICE_URL: http://carrito-service:8083
      VENTAS_SERVICE_URL: http://ventas-service:8084
      RABBIT_ADMIN_SERVICE_URL: http://rabbit-admin:8086
    depends_on:
      usuario-service: { condition: service_healthy }
      producto-service: { condition: service_healthy }
      carrito-service: { condition: service_healthy }
      ventas-service: { condition: service_healthy }
      rabbit-admin: { condition: service_healthy }

  # EP2: API para administrar colas, exchanges y bindings. Sin puerto
  # publicado: solo se entra por gateway -> bff, que exige el rol ADMIN.
  rabbit-admin:
    <<: *spring-service
    build: ./rabbit-admin
    image: milsabores/rabbit-admin:latest
    environment:
      <<: *jvm
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
    depends_on:
      rabbit2: { condition: service_healthy }

  api-gateway:
    <<: *spring-service
    build: ./api-gateway
    image: milsabores/api-gateway:latest
    ports: ["8080:8080"]
    environment:
      <<: *jvm
      USUARIO_SERVICE_URL: http://usuario-service:8081
      PRODUCTO_SERVICE_URL: http://producto-service:8082
      CARRITO_SERVICE_URL: http://carrito-service:8083
      VENTAS_SERVICE_URL: http://ventas-service:8084
      BFF_SERVICE_URL: http://bff:8085
    depends_on:
      bff: { condition: service_healthy }

  # Mismo clúster que docker-compose.yml. La cookie y rabbitmq.conf
  # tienen que ser los del repositorio: si la cookie cambia, el nodo
  # no entra al clúster. AMQP queda en la red interna (rabbit1:5672).
  rabbit1:
    image: rabbitmq:4.2-management
    hostname: rabbit1
    container_name: rabbit1
    restart: unless-stopped
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-milsabores-erlang-cookie}
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [milsabores]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  rabbit2:
    image: rabbitmq:4.2-management
    hostname: rabbit2
    container_name: rabbit2
    restart: unless-stopped
    ports:
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-milsabores-erlang-cookie}
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [milsabores]
    depends_on:
      rabbit1: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  # Declara exchanges, colas y DLQ, y termina. En un volumen nuevo
  # (la EC2 parte vacía) sin esto el clúster queda sin las seis colas.
  rabbit-topology:
    build: ./rabbit-topology
    image: milsabores/rabbit-topology:latest
    restart: "no"
    env_file: .env
    environment:
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+ExitOnOutOfMemoryError"
    networks: [milsabores]
    depends_on:
      rabbit2: { condition: service_healthy }

networks:
  milsabores:
    driver: bridge

volumes:
  rabbit1_data:
  rabbit2_data:
