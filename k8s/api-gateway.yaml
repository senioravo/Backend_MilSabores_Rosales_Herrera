# api-gateway - punto de entrada único. Mantener 1 réplica: el rate limiting es en memoria
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: milsabores
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: milsabores
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: milsabores
    spec:
      # Evita que K8s inyecte variables *_SERVICE_PORT que ensucian el entorno de Spring
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api-gateway
          image: milsabores/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: milsabores-config
            - secretRef:
                name: milsabores-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # Spring Boot tarda en arrancar: el startupProbe da hasta ~3 min
          # antes de que empiecen a correr liveness/readiness.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: milsabores
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
