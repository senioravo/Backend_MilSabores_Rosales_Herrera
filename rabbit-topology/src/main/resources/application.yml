spring:
  application:
    name: rabbit-topology
  rabbitmq:
    # En el PC, sin variables, entra a rabbit1 por localhost:5672.
    # En la EC2 el compose pone rabbit1:5672,rabbit2:5672.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
