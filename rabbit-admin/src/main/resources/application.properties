spring.application.name=rabbit-admin
server.port=8086
server.address=0.0.0.0

# Dentro de Docker Compose los nodos se llaman rabbit1 y rabbit2.
# Si el JAR corre en el PC: RABBITMQ_ADDRESSES=localhost:5672,localhost:5673
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:rabbit1:5672,rabbit2:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
